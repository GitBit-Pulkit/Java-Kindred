# ============================================================
#  Kindred configuration file
#  Read at start-up by com.kindred.util.ConfigLoader (StreamTokenizer).
#
#  Format :  key = value
#  - Lines starting with # are comments.
#  - Text values containing symbols ( : / @ ? spaces ) MUST be in "double quotes".
#  - Numbers can be written without quotes.
#  - A malformed line is skipped with a warning; the app still starts.
# ============================================================

# ---- MySQL connection (createDatabaseIfNotExist creates the `kindred` database for you)
db.url      = "jdbc:mysql://localhost:3306/kindred?createDatabaseIfNotExist=true"
db.user     = "root"
db.password = "CHANGE_ME"

# ---- Credit economy
starting.credits  = 5     # credits every new account receives
credits.per.hour  = 1     # 1 hour of teaching = 1 SkillCredit (time-bank)
max.session.hours = 4     # longest session that can be requested

# ---- SmartMatch
match.limit = 10          # how many top matches to show

# ---- Notifications (producer-consumer queue size)
notification.queue.capacity = 20

# ---- Files
export.dir = "exports"
